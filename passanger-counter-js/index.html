<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Passanger Counter</title>
<link rel="stylesheet" href="app.css">
<link rel="shortcut icon" href="assets/favicon.png" type="image/x-icon">
<script src="https://kit.fontawesome.com/47ef0eeb2e.js" crossorigin="anonymous"></script>
</head>
<body>
	<div class="container">
		<header>
			<nav>
				<div class="logo"><img src="assets/logo1.png" alt="logo image"></div>
				<h1>PassCounter</h1>
			</nav>
			<small>Real-time passanger tracking</small>
		</header>
		<!-- COUNTER CONTAINER -->
		 <div class="counter-container">
			<div class="top">
				<p>CURRENT PASSENGERS</p>
				<h1 class="count" id="count">0</h1>
				<small>of 50</small>
			</div>
			<!-- END OF TOP -->
			<div class="text-wrapper">
				<p>Capacity Meter</p>
				<p><span class="percentage">0</span>%</p>
				
			</div>
			<!-- END OF TEXT WRAPPER -->
			 <!-- start of progress bar -->
			<div id="progress-container" style="width: 100%; background: rgb(209, 213, 219); border-radius: 20px;">
			<div id="progress-bar" style="width: 30%; height: 30px; background: rgb(55, 65, 81); border-radius: 20px;"></div> 
			</div>
			<!-- END OF PROGRESS container -->
			<div class="buttons">
				<button>- Exit</button>
				<button>+ Board</button>
			</div>
			<button id="reset-btn">Reset Counter</button>
		 </div>
		 <!-- END OF COUNTER CONTAINER -->
	</div>
</body>
</html>
