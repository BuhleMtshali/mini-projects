<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Passanger Counter</title>
<link rel="stylesheet" href="app.css">
<link rel="shortcut icon" href="assets/favicon.png" type="image/x-icon">
</head>
<body>
	<div class="container">
		<header>
			<nav>
			<div class="logo"><img src="assets/logo1.png" alt="logo image"></div>
			<h1>PassCounter</h1>
			</nav>
			<small>Real-time passanger tracking</small>
		</header>
		<!-- COUNTER CONTAINER -->
		 <div class="counter-container">
			<div class="top">
				<p>CURRENT PASSENGERS</p>
				<h1 class="count" id="count">0</h1>
				<small>of 50</small>
			</div>
			<!-- END OF TOP -->
			 <!-- START OF PROGRESS BAR -->
			  <div id="progress-container" style="width: 100%; background: rgb(209, 213, 219)"></div>
		 </div>
		 <!-- END OF COUNTER CONTAINER -->
	</div>
</body>
</html>
